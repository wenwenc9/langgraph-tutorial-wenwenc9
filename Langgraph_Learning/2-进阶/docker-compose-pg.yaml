version: '3.8'
name: postgres-pgvector

services:
  postgres:
    image: pgvector/pgvector:pg16  # 🔥 备选方案：使用 pgvector 官方镜像
    container_name: postgres-pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: wenwenc9
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pg_network

  pgadmin:
    image: dpage/pgadmin4:8.12
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: wenwenc9@example.com
      PGADMIN_DEFAULT_PASSWORD: 123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped
    networks:
      - pg_network
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgvector_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  pg_network:
    driver: bridge